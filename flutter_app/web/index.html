<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="عين الحملة — تطبيق الحاج: الحضور والتجمعات والخريطة وطلب النجدة، ويعمل بدون إنترنت.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12332A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="عين الحملة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>عين الحملة</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // الدخول موحّد لكل الأدوار من صفحة واحدة: بدون جلسة تُفتح صفحة الدخول، وبعد تسجيل الخروج يرجع لها
    (function () {
      var LOGIN = '../dashboard/login.html';
      function hasToken() {
        try { var t = localStorage.getItem('flutter.ain_token'); return !!(t && JSON.parse(t)); } catch (e) { return true; }
      }
      if (!hasToken()) { location.replace(LOGIN); return; }
      // تسجيل الخروج من داخل التطبيق: نرجع لصفحة الدخول وننهي جلسة اللوحة المشتركة أيضاً
      setInterval(function () { if (!hasToken()) location.replace(LOGIN + '?from=app'); }, 1500);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // يحفظ التطبيق على الجهاز ليفتح بدون إنترنت (ain_sw.js)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('ain_sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
